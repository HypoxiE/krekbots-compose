networks:
  krekbots-network:
    name: krekbots-network
    driver: bridge

services:
  postgres:
    image: postgres:17
    networks: 
      - krekbots-network
    container_name: krekbots-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/pgdata:/var/lib/postgresql/data
      - ./postgres/backups:/docker-entrypoint-backups:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped


  krekbot-economy:
    build: ./economy-bot
    image: krekbot-economy
    container_name: krekbot-economy
    restart: always
    networks:
      - krekbots-network
    env_file:
      - .env
      - ./economy-bot/.env
  krekbot-moderation:
    build: ./moderation-bot
    image: krekbot-moderation
    container_name: krekbot-moderation
    restart: always
    networks:
      - krekbots-network
    env_file:
      - .env
      - ./moderation-bot/.env